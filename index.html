<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perpus - Perpustakaan Digital</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-inner">
        <h1 class="header-judul">Perpus</h1>
        <p class="header-subjudul">Perpustakaan Digital</p>
      </div>
    </header>

    <main class="main">
      <!-- Bagian Statistik -->
      <section class="seksi-statistik">
        <div id="ringkasan-statistik" class="grid-statistik">
          <!-- Kartu statistik dirender JavaScript -->
        </div>
      </section>

      <!-- Bagian Pencarian & Filter -->
      <section style="margin-bottom: 24px">
        <div class="kotak-search">
          <input
            type="text"
            id="input-search"
            class="input-search"
            placeholder="Cari judul atau penulis..."
          />
          <button
            id="tombol-hapus-search"
            class="tombol-hapus-search"
            style="display: none"
          >
            ✖
          </button>
        </div>
        <div id="tombol-filter" class="grup-filter">
          <!-- Tombol filter dirender JavaScript -->
        </div>
        <div id="info-jumlah" class="info-jumlah"></div>
      </section>

      <!-- Bagian Koleksi Buku -->
      <section class="seksi-koleksi">
        <h2 class="seksi-judul">Koleksi Buku</h2>
        <div id="kontainer-buku" class="grid-buku">
          <!-- Kartu buku dirender JavaScript -->
        </div>
      </section>
    </main>

    <script src="js/app.js"></script>
  </body>
</html>
